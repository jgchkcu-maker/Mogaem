name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python
        run: pip install -e '.[dev]'
      - name: Python tests
        run: pytest -q
      - name: Python compile
        run: python -m compileall -q mogaem
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mini App
        working-directory: webapp
        run: npm install
      - name: Build Mini App
        working-directory: webapp
        run: npm run build
