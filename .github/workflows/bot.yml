name: Run Mogaem bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */5 * * *"

concurrency:
  group: mogaem-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 298
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: Validate secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$BOT_TOKEN" || (echo "BOT_TOKEN secret is missing" && exit 1)
          test -n "$DATABASE_URL" || (echo "DATABASE_URL secret is missing" && exit 1)
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -m mogaem.bot
