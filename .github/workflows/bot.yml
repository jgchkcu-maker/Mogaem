name: Run Mogaem test runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mogaem/**"
      - "webapp/**"
      - "pyproject.toml"
      - ".github/workflows/bot.yml"
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: mogaem-bot
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore temporary SQLite database
        uses: actions/cache@v4
        with:
          path: mogaem.db*
          key: mogaem-db-${{ github.run_id }}
          restore-keys: |
            mogaem-db-

      - name: Install backend
        run: pip install .

      - name: Build Mini App
        working-directory: webapp
        run: |
          npm install
          npm run build

      - name: Validate bot token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: test -n "$BOT_TOKEN" || (echo "BOT_TOKEN secret is missing" && exit 1)

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Mini App, tunnel and bot
        id: bootstrap
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -n "$DATABASE_URL_SECRET" ]; then
            export DATABASE_URL="$DATABASE_URL_SECRET"
          fi

          nohup python -m uvicorn mogaem.api:app --host 127.0.0.1 --port 8000 >uvicorn.log 2>&1 &
          echo $! > .api.pid

          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            if ! kill -0 "$(cat .api.pid)" 2>/dev/null; then
              cat uvicorn.log
              exit 1
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health

          nohup ./cloudflared tunnel --url http://127.0.0.1:8000 --no-autoupdate >cloudflared.log 2>&1 &
          echo $! > .tunnel.pid

          PUBLIC_URL=""
          for i in $(seq 1 60); do
            PUBLIC_URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
            if [ -n "$PUBLIC_URL" ]; then break; fi
            if ! kill -0 "$(cat .tunnel.pid)" 2>/dev/null; then
              cat cloudflared.log
              exit 1
            fi
            sleep 1
          done
          if [ -z "$PUBLIC_URL" ]; then
            cat cloudflared.log
            exit 1
          fi
          export PUBLIC_URL

          PUBLIC_READY=0
          for i in $(seq 1 90); do
            if curl --silent --show-error --fail --connect-timeout 5 --max-time 10 "$PUBLIC_URL/health" >/dev/null; then
              PUBLIC_READY=1
              break
            fi
            if ! kill -0 "$(cat .tunnel.pid)" 2>/dev/null; then
              echo "Quick Tunnel process exited before its public URL became reachable"
              cat cloudflared.log
              exit 1
            fi
            sleep 1
          done
          if [ "$PUBLIC_READY" -ne 1 ]; then
            echo "Quick Tunnel URL did not become reachable in time: $PUBLIC_URL"
            cat cloudflared.log
            exit 1
          fi
          echo "Quick Tunnel is reachable: $PUBLIC_URL"

          python -m mogaem.configure_webapp "$PUBLIC_URL"
          python - <<'PY'
          import asyncio
          import os

          from aiogram import Bot
          from aiogram.types import MenuButtonWebApp

          async def main() -> None:
              bot = Bot(os.environ["BOT_TOKEN"])
              try:
                  button = await bot.get_chat_menu_button()
                  expected_url = os.environ["PUBLIC_URL"].rstrip("/")
                  actual_url = button.web_app.url.rstrip("/") if isinstance(button, MenuButtonWebApp) else None
                  if not isinstance(button, MenuButtonWebApp):
                      raise SystemExit(f"Telegram menu button has unexpected type: {type(button).__name__}")
                  if button.text != "⚔️ Mogaem" or actual_url != expected_url:
                      raise SystemExit(
                          f"Telegram menu button mismatch: text={button.text!r}, url={actual_url!r}, expected={expected_url!r}"
                      )
                  print(f"Verified Telegram menu button: {button.text} -> {actual_url}")
              finally:
                  await bot.session.close()

          asyncio.run(main())
          PY

          printf '%s\n' "$PUBLIC_URL" > miniapp-url.txt
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Mogaem Mini App"
            echo ""
            echo "$PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          nohup python -m mogaem.bot >bot.log 2>&1 &
          echo $! > .bot.pid
          sleep 5
          if ! kill -0 "$(cat .bot.pid)" 2>/dev/null; then
            cat bot.log
            exit 1
          fi
          if ! grep -Eq 'Start polling|Run polling for bot' bot.log; then
            echo "Bot process is alive but polling start was not confirmed"
            cat bot.log
            exit 1
          fi
          grep -E 'Start polling|Run polling for bot' bot.log

      - name: Publish current Mini App URL
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-url
          path: miniapp-url.txt
          retention-days: 1
          if-no-files-found: error

      - name: Keep test runtime alive
        env:
          PUBLIC_URL: ${{ steps.bootstrap.outputs.public_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            kill -0 "$(cat .api.pid)"
            kill -0 "$(cat .tunnel.pid)"
            kill -0 "$(cat .bot.pid)"
            curl --silent --fail "$PUBLIC_URL/health" >/dev/null
            sleep 60
          done

      - name: Stop services and checkpoint SQLite
        if: always()
        env:
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          for pidfile in .bot.pid .tunnel.pid .api.pid; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
              sleep 1
            fi
          done
          if [ -z "$DATABASE_URL_SECRET" ] && [ -f mogaem.db ]; then
            python -c 'import sqlite3; c=sqlite3.connect("mogaem.db"); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.close()'
          fi
          echo "--- bot.log ---"
          tail -n 40 bot.log 2>/dev/null || true
          echo "--- uvicorn.log ---"
          tail -n 40 uvicorn.log 2>/dev/null || true
          echo "--- cloudflared.log ---"
          tail -n 40 cloudflared.log 2>/dev/null || true
